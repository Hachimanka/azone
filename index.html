<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AZONE · Aznar Employee Platform</title>
    <meta name="description" content="AZONE is the Aznar employee platform — payslips, attendance, leaves, requests and announcements in one place." />
    <meta name="theme-color" content="#1557E0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AZONE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply dark mode before first paint (app routes only) so there's no white flash; src/store/theme.ts owns it after that.
      try {
        if (location.pathname.startsWith('/app')) {
          var saved = JSON.parse(localStorage.getItem('azone-theme') || 'null')
          var theme = saved && saved.state ? saved.state.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
